name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Package
        run: Compress-Archive publish\GameManager.exe "GameManager-$env:GITHUB_REF_NAME.zip"

      # gh release create fails if the release already exists, so re-runs
      # of a failed build upload to the release instead.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:GITHUB_REF_NAME 2> $null) {
            gh release upload $env:GITHUB_REF_NAME "GameManager-$($env:GITHUB_REF_NAME).zip" --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME --generate-notes "GameManager-$($env:GITHUB_REF_NAME).zip"
          }
